name: Card lottery watcher

on:
  schedule:
    # GitHub Actions の cron は UTC。毎日 09:00（日本時間）。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      notification_target:
        description: "通知先（開発用で検証してから本番へ）"
        required: true
        default: development
        type: choice
        options:
          - development
          - production

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and notify
        env:
          # Scheduled runs always use the production channel. Manual runs
          # default to the private development channel unless explicitly set
          # to production from the Run workflow menu.
          DISCORD_WEBHOOK_URL: ${{ (github.event_name == 'schedule' || inputs.notification_target == 'production') && secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_DEV_URL }}
          DAILY_SITE_UPDATE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ADMIN_QUEUE_URL: ${{ secrets.ADMIN_QUEUE_URL }}
          ADMIN_QUEUE_KEY: ${{ secrets.ADMIN_QUEUE_KEY }}
          ADMIN_DISCORD_WEBHOOK_URL: ${{ secrets.ADMIN_DISCORD_WEBHOOK_URL }}
          ADMIN_DASHBOARD_URL: https://card-lottery-ops.tkt-1234.chatgpt.site
          CALENDAR_URL: https://20001111.github.io/card-lottery-watcher/
          # Development runs are a notification/collection test only.  They
          # must not replace the public Website or its saved new-item state.
          PUBLISH_PUBLIC: ${{ (github.event_name == 'schedule' || inputs.notification_target == 'production') && 'true' || 'false' }}
        run: python -m src.main
      - name: Save state
        if: github.event_name == 'schedule' || inputs.notification_target == 'production'
        run: |
          git config user.name "lottery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lotteries.json docs/
          git diff --cached --quiet || git commit -m "Update lottery state"
          git push
