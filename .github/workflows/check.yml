name: Card lottery watcher

on:
  workflow_dispatch:
    inputs:
      notification_target:
        description: "通知先（開発用で検証してから本番へ）"
        required: true
        default: development
        type: choice
        options:
          - development
          - production

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and notify
        env:
          # Manual runs default to the private development channel unless
          # production is explicitly selected from the Run workflow menu.
          DISCORD_WEBHOOK_URL: ${{ inputs.notification_target == 'production' && secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_DEV_URL }}
          DAILY_SITE_UPDATE: "false"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ADMIN_QUEUE_URL: ${{ secrets.ADMIN_QUEUE_URL }}
          ADMIN_QUEUE_KEY: ${{ secrets.ADMIN_QUEUE_KEY }}
          ADMIN_DISCORD_WEBHOOK_URL: ${{ secrets.ADMIN_DISCORD_WEBHOOK_URL }}
          RESULT_DISCORD_WEBHOOK_URL: ${{ secrets.RESULT_DISCORD_WEBHOOK_URL }}
          ADMIN_DASHBOARD_URL: https://20001111.github.io/card-lottery-watcher/admin.html
          CALENDAR_URL: https://20001111.github.io/card-lottery-watcher/
          SUPABASE_URL: https://ziuuxvcomyhnrleoecdq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PUBLISH_PUBLIC: ${{ inputs.notification_target == 'production' && 'true' || 'false' }}
        run: python -m src.main
      - name: Save state
        if: inputs.notification_target == 'production'
        run: |
          git config user.name "lottery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lotteries.json docs/
          git diff --cached --quiet || git commit -m "Update lottery state"
          git push
