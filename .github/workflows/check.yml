name: Card lottery watcher

on:
  schedule:
    - cron: "30 7 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          CALENDAR_URL: ${{ secrets.CALENDAR_URL }}
        run: python -m src.main
      - name: Save state
        run: |
          git config user.name "lottery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lotteries.json docs/
          git diff --cached --quiet || git commit -m "Update lottery state"
          git push
