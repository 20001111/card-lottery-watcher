timezone: Asia/Tokyo
digest_hour: 7
digest_minute: 30
request_timeout_seconds: 20
ai_model: gpt-5-mini
minimum_ai_confidence: 0.75
max_deadline_days: 45
# Official announcement pages are followed only for the first matching details.
# This keeps costs and requests small while allowing dates and conditions to be verified.
official_detail_link_limit: 2

# X is optional. When enabled, the official API makes exactly one search request
# per workflow run and retrieves at most 10 posts. Every linked page still goes
# through the same AI validation as the normal sources.
x_discovery:
  enabled: true
  max_posts: 10
  query: '"ポケカ" (抽選 OR 応募) has:links lang:ja -is:retweet -is:reply'
  # These accounts are prioritized as leads, not trusted as proof. Their linked
  # pages must still contain a valid, future deadline before notification.
  priority_accounts:
    - PokeGetInfoMain
    - Meisy_TCG_News
    - mirar_times
    - omusubicororiin
    - shiryuu8
    - pokecayoyaku
  priority_minimum_ai_confidence: 0.75
  other_minimum_ai_confidence: 0.88
  require_official_confirmation: true

preferences:
  base_station: 水道橋
  max_travel_minutes: 90
  pickup_prefectures: [東京都, 千葉県, 埼玉県, 神奈川県]

# true/false/null（不明）で登録します。注文番号などの個人情報は保存しません。
eligibility:
  pokemon_center:
    account: true
    phone_verified: null
  geo:
    account: null
    app_installed: null
    purchase_history: null
  joshin:
    account: null
    purchase_history: null
  cardbox:
    account: null
    purchase_history: null

# discovery は発見用、official は裏取り用です。
sources:
  - name: ポケモンセンターオンライン
    store_key: pokemon_center
    kind: official
    category: pokemon
    url: https://www.pokemoncenter-online.com/news/
  - name: ポケモンセンター公式店舗
    store_key: pokemon_center_store
    kind: official
    category: pokemon
    url: https://shop.pokemon.co.jp/ja/shop/common/news/
  - name: ゲオ公式お知らせ
    store_key: geo
    kind: official
    category: both
    url: https://geo-online.co.jp/news/
  - name: ONE PIECEカード公式TOPICS
    store_key: onepiece_official
    kind: official
    category: onepiece
    url: https://www.onepiece-cardgame.com/topics/
  - name: 入荷Now ポケカ
    store_key: nyuka_now
    kind: discovery
    category: pokemon
    url: https://nyuka-now.com/archives/2459
  - name: 入荷Now ワンピース
    store_key: nyuka_now
    kind: discovery
    category: onepiece
    url: https://nyuka-now.com/archives/97393
  - name: カード抽選販売まとめ
    store_key: cardchusen
    kind: discovery
    category: both
    url: https://cardchusen.com/
  - name: ポケカウォッチ
    store_key: pokecawatch
    kind: discovery
    category: pokemon
    url: https://pokecawatch.com/category/%E6%8A%BD%E9%81%B8%E3%83%BB%E4%BA%88%E7%B4%84%E6%83%85%E5%A0%B1
